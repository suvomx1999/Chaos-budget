<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="15%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#060a13"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Logo dot -->
  <circle cx="80" cy="72" r="8" fill="#00d4aa" opacity="0.9"/>

  <!-- Logo text -->
  <text x="100" y="78" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#e1e7ef">Chaos Budget</text>

  <!-- Badge -->
  <rect x="400" y="160" width="400" height="36" rx="18" fill="rgba(0,212,170,0.08)" stroke="rgba(0,212,170,0.15)" stroke-width="1"/>
  <text x="600" y="183" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#00d4aa" text-anchor="middle">Monte Carlo · Causal Inference · LLM</text>

  <!-- Main heading -->
  <text x="600" y="280" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="600" fill="#e1e7ef" text-anchor="middle">How much of your career</text>
  <text x="600" y="345" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="600" fill="#00d4aa" text-anchor="middle">is really you?</text>

  <!-- Subtext -->
  <text x="600" y="405" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="300" fill="#64748b" text-anchor="middle">Simulate 1,000 alternate career paths to measure skill vs. luck vs. timing</text>

  <!-- Stats -->
  <text x="320" y="510" font-family="monospace" font-size="36" font-weight="700" fill="#00d4aa" text-anchor="middle">1,000</text>
  <text x="320" y="540" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle" text-transform="uppercase" letter-spacing="2">SIMULATIONS</text>

  <text x="600" y="510" font-family="monospace" font-size="36" font-weight="700" fill="#3b82f6" text-anchor="middle">DoWhy</text>
  <text x="600" y="540" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle" text-transform="uppercase" letter-spacing="2">CAUSAL ENGINE</text>

  <text x="880" y="510" font-family="monospace" font-size="36" font-weight="700" fill="#f59e0b" text-anchor="middle">Groq</text>
  <text x="880" y="540" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle" text-transform="uppercase" letter-spacing="2">AI NARRATIVE</text>

  <!-- URL -->
  <text x="600" y="600" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">chaos-budget.vercel.app</text>
